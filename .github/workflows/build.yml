name: Windows Brightness Tool - 自动构建

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==5.13.2
    
    - name: 打包构建
      run: |
        echo "创建版本信息文件..."
        @"
VSVersionInfo(ffi=FixedFileInfo(filevers=(1,0,0,0),prodvers=(1,0,0,0),mask=0x3f,flags=0x0,OS=0x40004,fileType=0x1,subtype=0x0,date=(0,0)),kids=[StringFileInfo([StringTable(u'040904B0',[StringStruct(u'FileDescription',u'亮度调节工具'),StringStruct(u'ProductName',u'BrightnessTool')])]),VarFileInfo([VarStruct(u'Translation',[0x409,1200])])])
"@ | Out-File -FilePath "version_info.txt" -Encoding UTF8
        
        pyinstaller --onefile --windowed --name "BrightnessTool" --version-file "version_info.txt" --clean brightness_controller.py
      shell: powershell
    
    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: BrightnessTool
        path: dist\BrightnessTool.exe
    
    - name: 发布Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist\BrightnessTool.exe
