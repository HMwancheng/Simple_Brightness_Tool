name: Windows Brightness Tool - 自动构建

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许上传release资产
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'  # 缓存pip依赖
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==5.13.2  # 指定PyInstaller版本确保稳定性
    
    - name: 创建图标资源文件（可选）
      run: |
        # 使用PowerShell创建RC文件
        "IDI_ICON1 ICON DISCARDABLE `"app.ico`"" | Out-File -FilePath app.rc -Encoding ASCII
        # 如果没有app.ico文件，创建一个简单的文本文件避免构建错误
        if (-not (Test-Path "app.ico")) {
            New-Item -ItemType File -Name "app.ico" -Value "dummy"
        }
      shell: powershell
    
    - name: 使用PyInstaller打包（无图标版本）
      if: ${{ !exists('app.ico') }}
      run: |
        pyinstaller ^
          --onefile ^
          --windowed ^
          --name "BrightnessTool" ^
          --clean ^
          --noupx ^
          brightness_controller.py
      shell: cmd
    
    - name: 使用PyInstaller打包（带图标版本）
      if: ${{ exists('app.ico') }}
      run: |
        pyinstaller ^
          --onefile ^
          --windowed ^
          --name "BrightnessTool" ^
          --icon "app.ico" ^
          --version-file "version_info.txt" ^
          --clean ^
          --noupx ^
          brightness_controller.py
      shell: cmd
    
    - name: 验证构建产物
      run: |
        dir dist\
        if exist "dist\BrightnessTool.exe" (echo "构建成功") else (echo "构建失败" && exit 1)
    
    - name: 压缩构建产物
      run: |
        $tagName = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
        Compress-Archive -Path dist\BrightnessTool.exe -DestinationPath "BrightnessTool_$tagName.zip"
      shell: powershell
    
    - name: 上传构建产物作为Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrightnessTool-Windows
        path: dist\BrightnessTool.exe
    
    - name: 发布Release（仅标签推送时）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          BrightnessTool_${{ github.ref_name }}.zip
          dist\BrightnessTool.exe
        body: |
          ## BrightnessTool ${{ github.ref_name }}
          
          ### 更新内容
          - 内置DDC/CI功能，无需外部依赖
          - 支持新旧DDC/CI检测方式切换
          - 系统托盘滚轮调节亮度
          - 原生风格亮度提示条
          
          ### 使用说明
          1. 下载BrightnessTool.exe直接运行
          2. 或解压压缩包后运行
          3. 首次运行请以管理员身份启动
