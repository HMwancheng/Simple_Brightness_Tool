name: Build Brightness Tool

on:
  push:
    branches: [ "GMN" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (Build EXE)
      # 生成单个EXE，不包含庞大的运行库(假设你电脑有.NET8)，如果想要完全绿色版把 --self-contained false 改为 true
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o build_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleBrightnessTool
        path: build_output/*.exe
