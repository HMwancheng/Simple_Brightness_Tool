name: Build and Release

on:
  push:
    branches: [ "GMN", "TR-CG" ]
  workflow_dispatch:

# 必须赋予写权限才能创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 检出代码 (fetch-depth: 0 确保能检测到文件变动历史)
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. 检测 BuildRelease.md 是否发生变化
    - name: Check for Release Update
      id: check_file
      uses: dorny/paths-filter@v3
      with:
        filters: |
          release:
            - 'BuildRelease.md'

    # 3. 配置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 4. 发版时自动递增 Patch 版本号并提交回仓库
    - name: Bump Version
      id: version
      if: steps.check_file.outputs.release == 'true' && github.ref == 'refs/heads/GMN'
      shell: pwsh
      run: |
        [xml]$proj = Get-Content -Raw SimpleBrightness.csproj
        $current = [version]$proj.Project.PropertyGroup.Version
        $newVersion = "{0}.{1}.{2}" -f $current.Major, $current.Minor, ($current.Build + 1)
        $proj.Project.PropertyGroup.Version = $newVersion
        $proj.Save((Resolve-Path SimpleBrightness.csproj))
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add SimpleBrightness.csproj
        git commit -m "chore: bump version to v$newVersion [skip ci]"
        git push origin HEAD:${{ github.ref_name }}
        "version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # 5. 恢复依赖
    - name: Restore dependencies
      run: dotnet restore

    # 6. 编译生成 EXE (始终执行)
    - name: Publish (Build EXE)
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o build_output

    # 7. 上传 Artifact (始终执行，作为普通 Action 产物)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleBrightnessTool
        path: build_output/*.exe
        retention-days: 30

    # 8. 生成版本标签 (仅当 BuildRelease.md 变化且是 GMN 分支时执行)
    - name: Generate Tag
      id: tag
      if: steps.check_file.outputs.release == 'true' && github.ref == 'refs/heads/GMN'
      shell: bash
      run: echo "tag_name=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

    # 9. 创建 Release 并上传文件 (仅当 BuildRelease.md 变化且是 GMN 分支时执行)
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: steps.check_file.outputs.release == 'true' && github.ref == 'refs/heads/GMN'
      with:
        # 使用上面生成的时间戳作为标签名
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        # 读取 BuildRelease.md 的内容作为发布说明
        body_path: BuildRelease.md
        draft: false
        prerelease: false
        files: |
          build_output/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
