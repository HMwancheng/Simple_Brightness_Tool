<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(128, 128) scale(1.306) translate(-128, -128)">
    <!-- Windows 11 Fluent Style Minimalist Sun -->
    <defs>
      <linearGradient id="fluent_gradient" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFDD00"/>
        <stop offset="100%" stop-color="#FF9500"/>
      </linearGradient>
      <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- Sun Rays (Modern pill shapes) -->
    <rect x="120" y="30" width="16" height="36" rx="8" fill="url(#fluent_gradient)"/>
    <rect x="120" y="190" width="16" height="36" rx="8" fill="url(#fluent_gradient)"/>
    <rect x="30" y="120" width="36" height="16" rx="8" fill="url(#fluent_gradient)"/>
    <rect x="190" y="120" width="36" height="16" rx="8" fill="url(#fluent_gradient)"/>
    
    <rect x="62" y="62" width="16" height="30" rx="8" fill="url(#fluent_gradient)" transform="rotate(45 70 77)"/>
    <rect x="178" y="178" width="16" height="30" rx="8" fill="url(#fluent_gradient)" transform="rotate(45 186 193)"/>
    <rect x="178" y="62" width="16" height="30" rx="8" fill="url(#fluent_gradient)" transform="rotate(-45 186 77)"/>
    <rect x="62" y="178" width="16" height="30" rx="8" fill="url(#fluent_gradient)" transform="rotate(-45 70 193)"/>

    <!-- Sun Disk -->
    <circle cx="128" cy="128" r="48" fill="url(#fluent_gradient)" filter="url(#soft_glow)"/>
  </g>
</svg>
